image: node:18.17.0

definitions:
  steps:
    - step: &lint-step
        name: Lint Code
        caches:
          - node
        script:
          - cd frontend
          - npm ci --legacy-peer-deps
          - npm run lint
          - npm run format:check
    
    - step: &test-step
        name: Run Tests
        caches:
          - node
        script:
          - cd frontend
          - npm ci --legacy-peer-deps
          - npm run test:ci
    
    - step: &build-step
        name: Build Application
        caches:
          - node
        script:
          - cd frontend
          - npm ci --legacy-peer-deps
          - npm run build
        artifacts:
          - frontend/dist/**
    
    - step: &deploy-staging-step
        name: Deploy to Staging
        deployment: staging
        script:
          - cd frontend
          - npm install -g firebase-tools
          - firebase deploy --only hosting --project career-connect-lesotho-staging --token "$FIREBASE_TOKEN"
    
    - step: &deploy-production-step
        name: Deploy to Production
        deployment: production
        trigger: manual
        script:
          - cd frontend
          - npm install -g firebase-tools
          - firebase deploy --only hosting --project career-connect-lesotho --token "$FIREBASE_TOKEN"

pipelines:
  default:
    - parallel:
      - step: *lint-step
      - step: *test-step
    - step: *build-step

  branches:
    staging:
      - step: *lint-step
      - step: *test-step
      - step: *build-step
      - step: *deploy-staging-step
    
    main:
      - step: *lint-step
      - step: *test-step
      - step: *build-step
      - step: *deploy-production-step

  pull-requests:
    '**':
      - step: *lint-step
      - step: *test-step
      - step: *build-step