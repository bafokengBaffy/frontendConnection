trigger:
  - main
  - staging
  - develop

pool:
  vmImage: ubuntu-latest

variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm
  FRONTEND_DIR: frontend

stages:
  - stage: Build
    displayName: Build Application
    jobs:
      - job: Build
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: Install Node.js

          - script: |
              cd $(FRONTEND_DIR)
              npm ci --legacy-peer-deps
            displayName: Install dependencies

          - script: |
              cd $(FRONTEND_DIR)
              npm run lint
            displayName: Run linting

          - script: |
              cd $(FRONTEND_DIR)
              npm run test:ci
            displayName: Run tests

          - script: |
              cd $(FRONTEND_DIR)
              npm run build
            displayName: Build application

          - publish: $(FRONTEND_DIR)/dist
            artifact: dist

  - stage: Deploy_Staging
    displayName: Deploy to Staging
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/staging'))
    jobs:
      - deployment: Deploy
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: dist

                - script: |
                    npm install -g firebase-tools
                    firebase deploy --only hosting --project career-connect-lesotho-staging --token "$(FIREBASE_TOKEN)"
                  displayName: Deploy to Firebase Staging
                  workingDirectory: $(FRONTEND_DIR)

  - stage: Deploy_Production
    displayName: Deploy to Production
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Deploy
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: dist

                - script: |
                    npm install -g firebase-tools
                    firebase deploy --only hosting --project career-connect-lesotho --token "$(FIREBASE_TOKEN)"
                  displayName: Deploy to Firebase Production
                  workingDirectory: $(FRONTEND_DIR)

  - stage: Security_Scan
    displayName: Security Scan
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Security
        steps:
          - script: |
              cd $(FRONTEND_DIR)
              npm audit --audit-level=high
            displayName: Run npm audit
            continueOnError: true

          - script: |
              cd $(FRONTEND_DIR)
              npx snyk test --severity-threshold=high
            displayName: Run Snyk security scan
            env:
              SNYK_TOKEN: $(SNYK_TOKEN)
            continueOnError: true
