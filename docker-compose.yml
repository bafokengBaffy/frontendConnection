version: '3.8'

services:
  # Frontend React Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: career-connect-frontend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:5001/api
      - VITE_WS_URL=ws://localhost:5002
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - career-connect-network
    depends_on:
      - backend
      - postgres
      - redis
      - elasticsearch

  # Backend Node.js API
  backend:
    image: node:18-alpine
    container_name: career-connect-backend
    working_dir: /app/backend
    ports:
      - '5001:5001'
      - '5002:5002'
    environment:
      - NODE_ENV=development
      - PORT=5001
      - WS_PORT=5002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=career_connect
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    command: npm run dev
    networks:
      - career-connect-network
    depends_on:
      - postgres
      - redis
      - elasticsearch

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: career-connect-postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=career_connect
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_MULTIPLE_DATABASES=career_connect_test,career_connect_production
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - career-connect-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Admin (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4
    container_name: career-connect-pgadmin
    ports:
      - '5050:80'
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@careerconnect.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - career-connect-network
    depends_on:
      - postgres

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: career-connect-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - career-connect-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Commander (Redis Admin)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: career-connect-redis-commander
    ports:
      - '8081:8081'
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - career-connect-network
    depends_on:
      - redis

  # Elasticsearch for search
  elasticsearch:
    image: elasticsearch:8.10.0
    container_name: career-connect-elasticsearch
    ports:
      - '9200:9200'
      - '9300:9300'
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - career-connect-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9200']
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana for Elasticsearch visualization
  kibana:
    image: kibana:8.10.0
    container_name: career-connect-kibana
    ports:
      - '5601:5601'
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - career-connect-network
    depends_on:
      - elasticsearch

  # MongoDB for logging and analytics
  mongodb:
    image: mongo:6
    container_name: career-connect-mongodb
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - MONGO_INITDB_DATABASE=career_connect
    volumes:
      - mongodb-data:/data/db
    networks:
      - career-connect-network

  # Mongo Express (MongoDB Admin)
  mongo-express:
    image: mongo-express
    container_name: career-connect-mongo-express
    ports:
      - '8082:8081'
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=admin
      - ME_CONFIG_MONGODB_SERVER=mongodb
    networks:
      - career-connect-network
    depends_on:
      - mongodb

  # RabbitMQ for message queuing
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: career-connect-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - career-connect-network

  # MinIO for object storage (S3 compatible)
  minio:
    image: minio/minio
    container_name: career-connect-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - career-connect-network

  # Nginx for load balancing and reverse proxy
  nginx:
    image: nginx:alpine
    container_name: career-connect-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - ./public:/usr/share/nginx/html
    networks:
      - career-connect-network
    depends_on:
      - frontend
      - backend

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: career-connect-certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./public:/var/www/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - career-connect-network

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus
    container_name: career-connect-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - career-connect-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana
    container_name: career-connect-grafana
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - career-connect-network
    depends_on:
      - prometheus

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: career-connect-jaeger
    ports:
      - '16686:16686'
      - '6831:6831/udp'
      - '6832:6832/udp'
      - '5778:5778'
      - '14268:14268'
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - career-connect-network

  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog
    container_name: career-connect-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - career-connect-network

  # Portainer for Docker management
  portainer:
    image: portainer/portainer-ce
    container_name: career-connect-portainer
    ports:
      - '9002:9000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - career-connect-network

networks:
  career-connect-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
  pgadmin-data:
  redis-data:
  elasticsearch-data:
  mongodb-data:
  rabbitmq-data:
  minio-data:
  prometheus-data:
  grafana-data:
  portainer-data:
